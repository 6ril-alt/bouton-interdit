<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ne clique pas</title>
    <style>
        * {
            box-sizing: border-box;
            transition: all 0.5s ease-in-out;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
        }

        /* --- PAGE PRINCIPALE (SOMBRE & EFFRAYANTE) --- */
        body.dark {
            background-color: #000000;
            color: #ff0000;
        }

        .dark h1 {
            font-size: 3.5rem;
            text-shadow: 0 0 15px #ff0000;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        /* Style pour le bouton image/GIF */
        .gif-button {
            background: none;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            transition: transform 0.2s ease, filter 0.2s ease;
        }

        .gif-button img {
            width: 160px;
            height: 160px;
            object-fit: contain;
            filter: drop-shadow(0 0 20px #ff0000);
        }

        .gif-button:hover {
            transform: scale(1.1);
        }

        .gif-button:active {
            transform: scale(0.95);
        }

        /* --- PAGE SECONDAIRE (LICORNE & ARC-EN-CIEL) --- */
        body.unicorn {
            background: linear-gradient(124deg, #ff2400, #e81d1d, #e8b71d, #e3e81d, #1de840, #1ddde8, #2b1de8, #dd00f3, #dd00f3);
            background-size: 1800% 1800%;
            animation: rainbow 6s ease infinite;
            color: #ffffff;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        @keyframes rainbow {
            0% { background-position: 0% 82% }
            50% { background-position: 100% 19% }
            100% { background-position: 0% 82% }
        }

        .unicorn h1 {
            font-size: 3.5rem;
            text-shadow: 3px 3px 0 #ff69b4, 6px 6px 0 #00ffff;
            animation: bounce 0.6s infinite alternate;
        }

        .unicorn-img {
            display: none;
            font-size: 6rem;
            margin: 20px 0;
            animation: spin 3s linear infinite;
        }

        .unicorn .unicorn-img {
            display: block;
        }

        .hidden {
            display: none;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-20px); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="dark">

    <!-- PAGE PRINCIPALE -->
    <div id="scary-content">
        <h1>Ne clique pas</h1>
        
        <button class="gif-button" onclick="revealUnicorns()">
            <!-- Image de bouton rouge animé en GIF -->
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYnVrYnVranI3dHI0ZHZrZzl5MTVoNXNjbWxucGltOG1uZXA3ZHdkaSZlcD12MV9zdGlja2Vyc19zZWFyY2gmY3Q9cw/QLoEZPIvVgff1K2wai/giphy.gif" alt="Bouton rouge">
        </button>
        
        <!-- BALISE CORRIGÉE ICI (Fermée avec > et taille fixée à 120px) -->
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExYmIzbHk2eXQ1aXc1M3Q4NHp3NmQ5dW5ubWd4aXZvN2VxaDg0NjB4NiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/f9RGrPdzevzdw503HP/giphy.gif" alt="tete de mort pirate" style="margin-top: 20px; width: 120px; display: block; margin-left: auto; margin-right: auto;">
    </div>

    <!-- PAGE LICORNE -->
    <div id="unicorn-content" class="hidden">
        <h1>✨ BIENVENUE AU PAYS DES MERVEILLES ! ✨</h1>
        <div class="unicorn-img">🦄🌈💖⭐</div>
        <p>C'est tout doux, tout mielleux et plein d'amour !</p>
    </div>

    <script>
        function revealUnicorns() {
            document.body.classList.remove('dark');
            document.body.classList.add('unicorn');

            document.getElementById('scary-content').classList.add('hidden');
            document.getElementById('unicorn-content').classList.remove('hidden');
        }
    </script>
</body>
</html>
